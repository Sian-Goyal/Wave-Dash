<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Dash - Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff87;
            --neon-blue: #60efff;
            --neon-pink: #ff007f;
            --neon-yellow: #fffb00;
            --bg-color: #0c081f;
            --panel-bg: rgba(30, 20, 55, 0.7);
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1b1240 0%, var(--bg-color) 100%);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            box-sizing: border-box;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.08);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(96, 239, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .stat-card.active-users::before { background: var(--neon-green); }
        .stat-card.total-users::before { background: var(--neon-blue); }
        .stat-card.premium-users::before { background: var(--neon-yellow); }

        .stat-val {
            font-size: 32px;
            font-weight: 900;
            margin: 5px 0 0 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.5px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 10px 15px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(96, 239, 255, 0.15);
        }

        .btn-refresh {
            background: linear-gradient(135deg, var(--neon-blue) 0%, #1b84f5 100%);
            border: none;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: transform 0.1s;
        }

        .btn-refresh:active {
            transform: scale(0.97);
        }

        .users-table-container {
            background: var(--panel-bg);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .status-online { background: rgba(0,255,135,0.1); color: var(--neon-green); border: 1px solid rgba(0,255,135,0.25); }
        .status-recent { background: rgba(255,251,0,0.1); color: var(--neon-yellow); border: 1px solid rgba(255,251,0,0.25); }
        .status-offline { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.10); }

        .btn-edit {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.2s;
        }

        .btn-edit:hover {
            background: var(--neon-blue);
            color: #000;
        }

        /* Modal styling */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(6, 4, 18, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 35px rgba(96, 239, 255, 0.25);
            border-radius: 24px;
            padding: 30px;
            width: 440px;
            text-align: center;
            box-sizing: border-box;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 15px 0;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-label {
            font-size: 11px;
            font-weight: 800;
            color: rgba(255,255,255,0.6);
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
        }

        .modal-input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .modal-input:focus {
            border-color: var(--neon-blue);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-modal-save {
            flex: 1.2;
            background: linear-gradient(135deg, var(--neon-green) 0%, var(--neon-blue) 100%);
            border: none;
            color: #000;
            font-weight: 900;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .btn-modal-cancel {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-weight: 800;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div>
                <h1>🎮 Wave Dash Admin</h1>
                <p style="margin: 5px 0 0 0; font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; font-weight: 800;">Realtime Player Tracking Panel</p>
            </div>
            <button class="btn-refresh" id="btn-refresh-data">Refresh Data 🔄</button>
        </header>

        <!-- Stats Cards Summary -->
        <div class="stats-summary">
            <div class="stat-card active-users">
                <div class="stat-label">🟢 Active Users (5m)</div>
                <div class="stat-val" id="stat-active">0</div>
            </div>
            <div class="stat-card total-users">
                <div class="stat-label">👥 Total Registered Users</div>
                <div class="stat-val" id="stat-total">0</div>
            </div>
            <div class="stat-card premium-users">
                <div class="stat-label">👑 Premium Players</div>
                <div class="stat-val" id="stat-premium">0</div>
            </div>
        </div>

        <!-- Filters controls -->
        <div class="controls">
            <input type="text" class="search-input" id="search-bar" placeholder="🔍 Search players by username, country, or tier...">
        </div>

        <!-- Users Table container -->
        <div class="users-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Status / Last Active</th>
                        <th>Premium status</th>
                        <th>Tickets (🎟️)</th>
                        <th>Coins (🪙)</th>
                        <th>Level Progress</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr>
                        <td colspan="7" style="text-align: center; color: rgba(255,255,255,0.5); padding: 40px;">Loading online users database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit User Modal Dialog -->
    <div class="modal" id="edit-user-modal">
        <div class="modal-card">
            <div class="modal-title" id="edit-modal-title">Edit Player</div>
            
            <div class="form-group">
                <label class="form-label">Premium Tickets (🎟️)</label>
                <input type="number" id="edit-user-tickets" class="modal-input" min="0">
            </div>
            
            <div class="form-group">
                <label class="form-label">Play-Earned Coins (🪙)</label>
                <input type="number" id="edit-user-coins" class="modal-input" min="0">
            </div>

            <div class="form-group">
                <label class="form-label">Premium Membership Tier</label>
                <select id="edit-user-tier" class="modal-input" style="background: #000; cursor: pointer;">
                    <option value="none">None (Standard)</option>
                    <option value="silver">Silver</option>
                    <option value="gold">Gold</option>
                    <option value="diamond">Diamond</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="btn-modal-save" id="btn-save-edit">Save Changes 💾</button>
                <button class="btn-modal-cancel" id="btn-cancel-edit">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://wave-dash-game-default-rtdb.firebaseio.com";
        let playersData = {};

        async function fetchPlayers() {
            const tableBody = document.getElementById('users-table-body');
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/users.json`);
                const data = await res.json();
                
                if (!data) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: rgba(255,255,255,0.5); padding: 40px;">No registered players found in database.</td></tr>`;
                    return;
                }

                playersData = data;
                renderPlayers();
            } catch (err) {
                console.error("Fetch error:", err);
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--neon-pink); padding: 40px;">⚠️ Connection failed. Could not load database.</td></tr>`;
            }
        }

        function getStatus(lastActiveISO) {
            if (!lastActiveISO) return { text: "offline", class: "status-offline", elapsed: "Never" };
            
            const diffMs = Date.now() - new Date(lastActiveISO).getTime();
            const diffMin = Math.floor(diffMs / 60000);
            
            if (diffMin < 3) {
                return { text: "online", class: "status-online", elapsed: "Active now" };
            } else if (diffMin < 15) {
                return { text: "recent", class: "status-recent", elapsed: `${diffMin}m ago` };
            } else {
                let timeStr = `${diffMin}m ago`;
                if (diffMin >= 60) {
                    const hours = Math.floor(diffMin / 60);
                    timeStr = `${hours}h ago`;
                    if (hours >= 24) {
                        timeStr = `${Math.floor(hours / 24)}d ago`;
                    }
                }
                return { text: "offline", class: "status-offline", elapsed: timeStr };
            }
        }

        function renderPlayers() {
            const tableBody = document.getElementById('users-table-body');
            const searchVal = document.getElementById('search-bar').value.toLowerCase().trim();
            tableBody.innerHTML = '';

            let totalUsers = 0;
            let activeUsers = 0;
            let premiumUsers = 0;

            const sortedKeys = Object.keys(playersData).sort((a, b) => {
                const timeA = playersData[a].lastActive ? new Date(playersData[a].lastActive).getTime() : 0;
                const timeB = playersData[b].lastActive ? new Date(playersData[b].lastActive).getTime() : 0;
                return timeB - timeA; // Sort online first
            });

            sortedKeys.forEach(username => {
                const player = playersData[username];
                totalUsers++;

                const status = getStatus(player.lastActive);
                if (status.text === 'online') activeUsers++;
                if (player.isPremium) premiumUsers++;

                // Apply search filter
                const countryText = player.country || 'IN';
                const premiumTierText = player.premiumTier || 'none';
                const matchesSearch = username.toLowerCase().includes(searchVal) || 
                                     countryText.toLowerCase().includes(searchVal) || 
                                     premiumTierText.toLowerCase().includes(searchVal);

                if (!matchesSearch && searchVal !== '') return;

                // Format premium tier label
                let premiumHTML = `<span style="color: rgba(255,255,255,0.4);">None</span>`;
                if (player.isPremium) {
                    const tierColors = {
                        silver: '#d1d1d1',
                        gold: 'var(--neon-yellow)',
                        diamond: 'var(--neon-blue)'
                    };
                    const color = tierColors[player.premiumTier?.toLowerCase()] || 'var(--neon-yellow)';
                    premiumHTML = `<span style="font-weight: 800; color: ${color}; text-shadow: 0 0 5px ${color}44;">👑 ${player.premiumTier?.toUpperCase() || 'PREMIUM'}</span>`;
                }

                // Format level progress
                let levelsPassed = 0;
                if (player.levelProgress) {
                    Object.keys(player.levelProgress).forEach(lvl => {
                        if (player.levelProgress[lvl] >= 100) levelsPassed++;
                    });
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: bold; color: #fff; font-family: monospace; font-size: 14px;">${player.username || username} <span style="font-size:10px; color:rgba(255,255,255,0.4); font-weight:normal;">(${player.country || 'IN'})</span></td>
                    <td><span class="status-badge ${status.class}">${status.text}</span> <span style="font-size:11px; color:rgba(255,255,255,0.4); margin-left: 5px;">${status.elapsed}</span></td>
                    <td>${premiumHTML}</td>
                    <td style="font-family: 'JetBrains Mono', monospace; font-weight: bold; color: #fff;">🎟️ ${player.coins || 0}</td>
                    <td style="font-family: 'JetBrains Mono', monospace; font-weight: bold; color: var(--neon-green);">🪙 ${player.game_coins || 0}</td>
                    <td><div style="font-weight: bold; color: var(--neon-blue);">${levelsPassed} / 500 <span style="font-size: 10px; color: rgba(255,255,255,0.45); font-weight: normal;">levels passed</span></div></td>
                    <td><button class="btn-edit" data-username="${username}">EDIT</button></td>
                `;
                tableBody.appendChild(row);
            });

            // Update stats summary totals
            document.getElementById('stat-total').textContent = totalUsers;
            document.getElementById('stat-active').textContent = activeUsers;
            document.getElementById('stat-premium').textContent = premiumUsers;

            // Bind click handlers to Edit buttons
            tableBody.querySelectorAll('.btn-edit').forEach(btn => {
                btn.onclick = () => {
                    const targetUser = btn.getAttribute('data-username');
                    openEditModal(targetUser);
                };
            });
        }

        // Edit Modal functionality
        let editingUser = null;
        const modal = document.getElementById('edit-user-modal');

        function openEditModal(username) {
            editingUser = username;
            const player = playersData[username];
            if (!player) return;

            document.getElementById('edit-modal-title').textContent = `Edit Player: ${player.username || username}`;
            document.getElementById('edit-user-tickets').value = player.coins || 0;
            document.getElementById('edit-user-coins').value = player.game_coins || 0;
            document.getElementById('edit-user-tier').value = player.premiumTier || 'none';

            modal.style.display = 'flex';
        }

        document.getElementById('btn-cancel-edit').onclick = () => {
            modal.style.display = 'none';
            editingUser = null;
        };

        document.getElementById('btn-save-edit').onclick = async () => {
            if (!editingUser) return;
            const player = playersData[editingUser];
            if (!player) return;

            const ticketsVal = parseInt(document.getElementById('edit-user-tickets').value) || 0;
            const coinsVal = parseInt(document.getElementById('edit-user-coins').value) || 0;
            const tierVal = document.getElementById('edit-user-tier').value;

            const isPremium = tierVal !== 'none';
            const premiumTier = isPremium ? tierVal : null;

            // Optimistic local update
            player.coins = ticketsVal;
            player.game_coins = coinsVal;
            player.isPremium = isPremium;
            player.premiumTier = premiumTier;

            modal.style.display = 'none';
            renderPlayers(); // Render instantly

            // Send PATCH request to Firebase Realtime Database
            try {
                await fetch(`${FIREBASE_DB_URL}/users/${editingUser.toLowerCase()}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        coins: ticketsVal,
                        game_coins: coinsVal,
                        isPremium: isPremium,
                        premiumTier: premiumTier
                    })
                });
                console.log(`Successfully updated ${editingUser} settings in Firebase database.`);
            } catch (err) {
                console.error("Save patch error:", err);
                alert("Failed to save changes online. Please verify connection.");
                fetchPlayers(); // Reload from cloud on failure
            }
            editingUser = null;
        };

        // Reload data bindings
        document.getElementById('btn-refresh-data').onclick = () => fetchPlayers();
        document.getElementById('search-bar').oninput = () => renderPlayers();

        // Initial load
        fetchPlayers();

        // Poll database automatically every 10 seconds for real-time tracking
        setInterval(fetchPlayers, 10000);
    </script>
</body>
</html>
