<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Dash - Golden Passcode</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff87;
            --neon-blue: #60efff;
            --bg-color: #0c081f;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1b1240 0%, var(--bg-color) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            box-sizing: border-box;
            padding: 20px;
        }

        .container {
            background: rgba(30, 20, 55, 0.7);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 30px rgba(0, 255, 135, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 420px;
            max-width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 135, 0.5));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: var(--neon-green);
            text-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
            margin: 0 0 30px 0;
            line-height: 1.5;
        }

        .code-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px dashed var(--neon-green);
            border-radius: 12px;
            padding: 18px 10px;
            font-family: monospace;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            position: relative;
            user-select: all;
        }

        .btn-copy {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #000;
            background: linear-gradient(135deg, var(--neon-green) 0%, var(--neon-blue) 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 135, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-copy:active {
            transform: scale(0.98);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--neon-green);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🎟️</div>
        <h1>Golden VIP Pass</h1>
        <p>You scanned the Golden Pass QR Code! Copy the passcode below and paste it in the game menu to redeem your reward.</p>
        
        <div class="code-box" id="passcode-display">WAVEDASHFREEVIP123</div>
        
        <button class="btn-copy" id="btn-copy-passcode">Copy Passcode 📋</button>
    </div>

    <div class="toast" id="copy-toast">Passcode Copied! 📋</div>

    <script>
        const copyBtn = document.getElementById('btn-copy-passcode');
        const codeText = 'WAVEDASHFREEVIP123';
        const toast = document.getElementById('copy-toast');

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(codeText).then(() => {
                // Show custom toast notification
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('Could not copy passcode: ' + err);
            });
        });
    </script>
</body>
</html>
